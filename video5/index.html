<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms-lets grab it</title>
</head>

<body>
    <h1>form to apply for sde</h1>
    <form action="post">
        <div>
            <label for="username">Enter your username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">female</label>
        <div>
            <input type="checkbox" id="experience" name="experience" value="yes">
            <label for="experience">are you experienced</label>
        </div>
        <div>
            <label for="skills">Enter your skills here</label>
            <br>
            <textarea name="skills" id="skills" rows="4" cols="50"></textarea>
        </div>
        <h5>choose your location for work</h5>
        <select name="location" id="location">
            <option value="Gurugram">Gurugram</option>
            <option value="Noida">Noida</option>
            <option value="Banglore">Banglore</option>
        </select>
        
        
            

    </form>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video, Audio and Media in HTML</title>
</head>

<body>

    <!-- Video -->
    <video src="video.mp4" controls width="255" poster="download.jpg"></video>

    <!-- Audio -->
    <audio controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- SVG Cube -->
    <svg width="200" height="200" viewBox="0 0 200 200">
        <!-- Front face -->
        <rect x="50" y="50" width="80" height="80" fill="skyblue" stroke="black" />

        <!-- Top face -->
        <polygon points="50,50 90,20 170,20 130,50" fill="lightblue" stroke="black" />

        <!-- Side face -->
        <polygon points="130,50 170,20 170,100 130,130" fill="deepskyblue" stroke="black" />
    </svg>
    <iframe 
  src="https://www.google.com/maps/embed?pb=..." 
  width="600" 
  height="450" 
  style="border:0;" 
  allowfullscreen 
  loading="lazy">
</iframe>
<iframe src="https://www.example.com" width="600" height="400"></iframe>
<iframe width="560" height="315" 
  src="https://www.youtube.com/embed/tgbNymZ7vqY" 
  frameborder="0" 
  allowfullscreen>
</iframe>

</body>

</html>
